<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dartzähler">
<title>Dartzähler</title>
<!-- Optional (nur wenn über http/https ausgeliefert): PWA-Dateien liegen daneben. Als Einzeldatei funktioniert alles auch ohne sie. -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='%23111'/%3E%3Ccircle cx='50' cy='50' r='40' fill='%23e8dcc0'/%3E%3Ccircle cx='50' cy='50' r='28' fill='%23d23a2f'/%3E%3Ccircle cx='50' cy='50' r='18' fill='%23e8dcc0'/%3E%3Ccircle cx='50' cy='50' r='8' fill='%231f8a4c'/%3E%3Ccircle cx='50' cy='50' r='3.5' fill='%23d23a2f'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#0b0f14; --panel:#151b23; --panel2:#1e2631; --line:#2b3542;
  --text:#eef2f6; --muted:#8c98a5; --accent:#ffcc33; --accent-bg:#2b2410;
  --green:#2fb36a; --red:#ef4b4b; --blue:#3b82f6;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  overscroll-behavior:none;touch-action:manipulation;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-text-size-adjust:100%}
body{position:fixed;inset:0;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
.hidden{display:none!important}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

/* ---------- Buttons ---------- */
.btn{border:0;border-radius:14px;background:var(--panel2);padding:14px 18px;font-size:18px;font-weight:700}
.btn:active{filter:brightness(1.25);transform:scale(.98)}
.btn.primary{background:var(--accent);color:#1a1400}
.btn.green{background:var(--green);color:#04130a}
.btn.danger{background:#3a1416;color:#ffb3b3}
.btn.big{width:100%;padding:18px;font-size:22px}
.btn:disabled{opacity:.35}

/* ---------- Setup ---------- */
.top{padding:14px 18px 6px}
.top h1{margin:0;font-size:28px;letter-spacing:.3px}
.scroll{flex:1;overflow-y:auto;padding:8px 14px 16px;touch-action:pan-y;-webkit-overflow-scrolling:touch}
.card{background:var(--panel);border-radius:16px;padding:14px;margin-bottom:12px}
.card h2{margin:0 0 10px;font-size:15px;text-transform:uppercase;letter-spacing:1px;color:var(--muted)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;background:var(--bg);padding:5px;border-radius:14px}
.seg button{border:0;background:transparent;border-radius:10px;padding:14px 0;font-size:24px;font-weight:800;color:var(--muted)}
.seg button.on{background:var(--accent);color:#1a1400}
.switch-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0}
.switch-row + .switch-row{border-top:1px solid var(--line)}
.switch-row span{font-size:20px;font-weight:700}
.switch-row small{display:block;font-size:14px;font-weight:400;color:var(--muted);margin-top:2px}
.switch-row input{display:none}
.switch-row i{flex:none;width:60px;height:34px;border-radius:20px;background:#39424f;position:relative;transition:background .2s}
.switch-row i::after{content:"";position:absolute;top:3px;left:3px;width:28px;height:28px;border-radius:50%;background:#fff;transition:transform .2s}
.switch-row input:checked + i{background:var(--green)}
.switch-row input:checked + i::after{transform:translateX(26px)}
.stepper{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0}
.stepper + .stepper{border-top:1px solid var(--line)}
.stepper .lbl{font-size:20px;font-weight:700;min-width:54px}
.stepper .ctl{display:flex;align-items:center;gap:8px}
.stepper .ctl b{min-width:130px;text-align:center;font-size:17px}
.stepper .ctl b small{display:block;color:var(--muted);font-weight:400;font-size:13px}
.round{width:46px;height:46px;border-radius:50%;border:0;background:var(--panel2);font-size:26px;font-weight:700;line-height:1}
.round:active{background:var(--line)}
#plist{list-style:none;margin:0 0 10px;padding:0}
#plist li{display:flex;align-items:center;gap:6px;background:var(--panel2);border-radius:12px;padding:6px 6px 6px 12px;margin-bottom:6px}
#plist li .num{color:var(--muted);font-weight:700;width:22px}
#plist li .nm{flex:1;font-size:20px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#plist li button{width:44px;height:44px;border:0;border-radius:10px;background:var(--panel);font-size:18px}
#plist li button.del{color:var(--red)}
#plist .empty{color:var(--muted);padding:6px 2px;background:none}
#addForm{display:flex;gap:8px}
#pname{flex:1;min-width:0;font-size:18px;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--text);
  -webkit-user-select:text;user-select:text;outline:none}
#pname:focus{border-color:var(--accent)}
#addForm button{width:56px;border:0;border-radius:12px;background:var(--green);color:#04130a;font-size:28px;font-weight:800}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chips .hint{width:100%;font-size:13px;color:var(--muted)}
.chip{border:1px solid var(--line);background:var(--panel2);border-radius:20px;padding:9px 14px;font-size:16px}
.chip:active{background:var(--line)}
.bottom{padding:10px 14px 14px;background:linear-gradient(transparent,var(--bg) 30%)}

/* ---------- Spiel ---------- */
.gtop{display:flex;align-items:center;gap:10px;padding:6px 10px 4px;min-height:42px}
.icon{width:44px;height:36px;border-radius:10px;border:0;background:var(--panel2);font-size:20px}
#matchInfo{flex:1;font-size:15px;color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#modeInfo{font-size:14px;color:var(--muted);font-weight:700;background:var(--panel);padding:5px 9px;border-radius:8px}
.cards{display:flex;gap:6px;overflow-x:auto;padding:0 8px 4px;scrollbar-width:none;touch-action:pan-x;flex:none}
.cards::-webkit-scrollbar{display:none}
.pc{flex:1 0 30%;min-width:108px;background:var(--panel);border:2px solid transparent;border-radius:12px;padding:5px 8px;transition:background .2s,border-color .2s}
.pc.on{border-color:var(--accent);background:var(--accent-bg)}
.pc .pn{font-size:14px;font-weight:700;display:flex;justify-content:space-between;gap:4px;white-space:nowrap;overflow:hidden}
.pc .pn span:first-child{overflow:hidden;text-overflow:ellipsis}
.pc .lg{color:var(--accent);font-variant-numeric:tabular-nums}
.pc .ps{font-size:30px;font-weight:900;line-height:1.05;font-variant-numeric:tabular-nums}
.pc .pm,.pc .pl{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc .pl .bust{color:var(--red);font-weight:700}
.active{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:2px 14px 0;flex:none}
.aleft{min-width:0}
#aName{font-size:22px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#aStats{font-size:13px;color:var(--muted)}
#aScore{font-size:clamp(58px,19vw,104px);font-weight:900;line-height:.92;color:var(--accent);font-variant-numeric:tabular-nums;letter-spacing:-2px}
.aright{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.darts{display:flex;gap:5px}
.darts .d{width:58px;height:42px;border-radius:10px;background:var(--panel2);display:flex;align-items:center;justify-content:center;
  font-size:21px;font-weight:800;border:2px solid transparent;font-variant-numeric:tabular-nums}
.darts .d.next{border-color:var(--accent)}
.darts .d.zero{color:var(--muted)}
.darts .d.void{color:var(--muted);text-decoration:line-through}
#vSum{font-size:26px;font-weight:900;font-variant-numeric:tabular-nums}
#vSum small{font-size:14px;color:var(--muted);font-weight:600}
#checkout{height:36px;flex:none;display:flex;align-items:center;justify-content:center;gap:8px;font-size:23px;font-weight:800;color:var(--green);letter-spacing:.3px}
#checkout small{font-size:13px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:1px}
#checkout.info{color:var(--blue);font-size:18px}
.inputArea{flex:1 1 0;min-height:0;position:relative;display:flex;flex-direction:column}
.boardwrap{flex:1 1 0;min-height:0;display:flex;align-items:center;justify-content:center;padding:0 2px;position:relative;overflow:hidden}
.zoomctl{display:flex;gap:6px}
.zoomctl button{width:40px;font-size:22px;font-weight:800;line-height:1}
.zoomctl button:active{background:var(--line)}
.zoomctl button:disabled{opacity:.3}
@media (max-width:360px){#modeInfo{display:none}}
.keypad{flex:1 1 0;min-height:0;display:flex;flex-direction:column;gap:6px;padding:4px 10px}
.kmods,.kbot{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;flex:none}
.kbot{grid-template-columns:1fr 1fr}
.knums{flex:1;min-height:0;display:grid;grid-template-columns:repeat(5,1fr);grid-auto-rows:1fr;gap:6px}
.keypad button{border:0;border-radius:12px;background:var(--panel2);font-size:clamp(22px,7vw,32px);font-weight:800;min-height:44px}
.kmods button,.kbot button{height:54px;font-size:20px}
.keypad button:active{filter:brightness(1.4);transform:scale(.96)}
.kmods .sgl.on{background:var(--accent);color:#1a1400}
.kmods .dbl.on{background:var(--red);color:#fff}
.kmods .tpl.on{background:var(--green);color:#04130a}
.keypad.m2 .knums button{box-shadow:inset 0 0 0 3px var(--red)}
.keypad.m3 .knums button{box-shadow:inset 0 0 0 3px var(--green)}
.keypad.m3 [data-k="25"],.keypad.m3 [data-k="50"]{opacity:.35}
.confirm{position:absolute;inset:0;z-index:5;background:rgba(8,11,16,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px;text-align:center;animation:pop .2s ease-out}
.confirm .cname{font-size:24px;font-weight:700;color:var(--muted)}
.confirm .cdarts{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.confirm .cdarts span{min-width:88px;padding:12px 10px;border-radius:14px;background:var(--panel2);font-size:36px;font-weight:900}
.confirm .ctotal{font-size:96px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.confirm.max .ctotal{color:var(--accent)}
.confirm.bust .ctotal{color:var(--red);letter-spacing:4px}
.confirm .crest{font-size:22px;color:var(--muted)}
.confirm .crest b{color:var(--text)}
.confirm .cgo{width:100%;max-width:440px;height:76px;border:0;border-radius:18px;background:var(--green);color:#04130a;font-size:26px;font-weight:900}
.confirm .cgo:active{filter:brightness(1.2);transform:scale(.98)}
.confirm .chint{font-size:14px;color:var(--muted)}
#missBtn.go{background:var(--green);color:#04130a}
#board{width:100%;height:100%;display:block;touch-action:none;-webkit-user-select:none;user-select:none}
#board text{pointer-events:none;font-family:inherit}
.controls{display:grid;grid-template-columns:1fr 1.5fr;gap:8px;padding:6px 10px 10px;flex:none}
.controls button{height:62px;border:0;border-radius:14px;font-size:22px;font-weight:800}
#undoBtn{background:var(--panel2)}
#missBtn{background:#3a4352}
.controls button:active{filter:brightness(1.3);transform:scale(.98)}
.controls button:disabled{opacity:.35}

/* ---------- Statistik ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px}
.statbtn{padding:10px 14px;font-size:16px}
.sttitle{flex:1;font-size:22px;font-weight:800}
.st-seg{margin-bottom:10px}
.st-seg button{font-size:17px;padding:11px 0}
.st-chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none;touch-action:pan-x}
.st-chips::-webkit-scrollbar{display:none}
.st-chips .chip{flex:none;font-weight:700}
.st-chips .chip.on{background:var(--accent);color:#1a1400;border-color:var(--accent)}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}
@media (min-width:520px){.tiles{grid-template-columns:repeat(3,1fr)}}
.tile{background:var(--panel);border-radius:14px;padding:10px 12px}
.tile .tl{font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);font-weight:700}
.tile .tv{font-size:30px;font-weight:900;line-height:1.15;font-variant-numeric:tabular-nums}
.tile .ts{font-size:12px;color:var(--muted)}
.tile.hero{grid-column:1/-1;display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.tile.hero .tv{font-size:56px;color:var(--accent);line-height:1}
.kv{display:grid;grid-template-columns:1fr auto;gap:0;font-size:16px}
.kv div{padding:8px 0;border-top:1px solid var(--line)}
.kv div:nth-child(-n+2){border-top:0}
.kv div:nth-child(even){text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
.bars{display:grid;grid-template-columns:auto 1fr auto;gap:8px 10px;align-items:center;font-size:14px}
.bars .bl{color:var(--muted);font-weight:700;white-space:nowrap}
.bars .bt{height:14px;background:var(--panel2);border-radius:0 4px 4px 0;overflow:hidden}
.bars .bf{height:100%;background:var(--accent);border-radius:0 4px 4px 0;min-width:2px}
.bars .bf.bad{background:#8c98a5}
.bars .bn{font-weight:800;font-variant-numeric:tabular-nums;text-align:right;min-width:52px}
.bars .bn small{color:var(--muted);font-weight:600}
.trend{display:flex;align-items:flex-end;gap:2px;height:120px;border-bottom:1px solid var(--line);padding-top:6px}
.trend button{flex:1;max-width:32px;border:0;padding:0;background:transparent;height:100%;display:flex;align-items:flex-end;min-width:6px}
.trend button span{display:block;width:100%;background:var(--accent);border-radius:4px 4px 0 0;opacity:.85}
.trend button.won span{opacity:1}
.trend button.lost span{background:#6b7682}
.trend button.sel span{outline:2px solid var(--text);outline-offset:1px}
.trendcap,.heatcap{font-size:14px;color:var(--muted);margin-top:8px;min-height:20px;text-align:center}
.trendcap b,.heatcap b{color:var(--text)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:6px;justify-content:center}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
#heat{width:100%;max-width:360px;display:block;margin:0 auto;touch-action:manipulation}
.heatscale{display:flex;align-items:center;gap:8px;justify-content:center;font-size:12px;color:var(--muted);margin-top:6px}
.heatscale span.g{width:120px;height:10px;border-radius:5px}
.outs{display:flex;flex-wrap:wrap;gap:6px}
.outs span{background:var(--panel2);border-radius:10px;padding:6px 10px;font-weight:800}
.outs span small{color:var(--muted);font-weight:600;margin-left:4px}
.empty-st{color:var(--muted);text-align:center;padding:40px 10px;font-size:17px}
.cmp{overflow-x:auto}
.cmp .stats{margin-bottom:0}
.cmp tr{cursor:pointer}

/* ---------- Overlays ---------- */
.overlay{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:rgba(5,8,12,.78);
  padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 16px)}
.flash .fbox{text-align:center;animation:pop .25s ease-out}
.flash .fsub{font-size:26px;font-weight:700;color:var(--muted)}
.flash .fmain{font-size:120px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.flash .fnext{font-size:20px;color:var(--muted);margin-top:14px}
.flash.bust .fmain{color:var(--red);letter-spacing:4px}
.flash.max .fmain{color:var(--accent)}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
.sheet{width:100%;max-width:520px;max-height:100%;overflow-y:auto;background:var(--panel);border-radius:20px;padding:20px;touch-action:pan-y;animation:pop .25s ease-out}
.sheet h3{margin:0 0 4px;font-size:30px;text-align:center}
.sheet .sub{text-align:center;color:var(--muted);font-size:16px;margin-bottom:14px}
.sheet .trophy{text-align:center;font-size:54px;line-height:1}
.stats{width:100%;border-collapse:collapse;font-size:15px;margin-bottom:16px;font-variant-numeric:tabular-nums}
.stats th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;padding:4px 3px;text-align:right}
.stats td{padding:8px 3px;border-top:1px solid var(--line);text-align:right}
.stats th:first-child,.stats td:first-child{text-align:left}
.stats tr.win td{color:var(--accent);font-weight:800}
.sheet .btns{display:grid;gap:10px}
.menu .btns .btn{width:100%}
</style>
</head>
<body>

<!-- ================= SETUP ================= -->
<section id="setup" class="screen">
  <header class="top topbar"><h1>🎯 Dartzähler</h1><button id="setupStats" class="btn statbtn">📊 Statistik</button></header>
  <div class="scroll">
    <button id="resumeBtn" class="btn green big hidden" style="margin-bottom:12px">▶ Spiel fortsetzen</button>

    <div class="card">
      <h2>Startpunkte</h2>
      <div class="seg" id="startSeg">
        <button data-v="301">301</button><button data-v="501">501</button><button data-v="701">701</button>
      </div>
    </div>

    <div class="card">
      <label class="switch-row"><span>Double In<small>Punkte zählen erst nach einem Double</small></span><input type="checkbox" id="optDI"><i></i></label>
      <label class="switch-row"><span>Double Out<small>Finish nur mit Double oder Bullseye</small></span><input type="checkbox" id="optDO"><i></i></label>
      <label class="switch-row"><span>Zifferneingabe<small>Zahlen-Tastatur statt Dartscheibe (im Spiel umschaltbar)</small></span><input type="checkbox" id="optNum"><i></i></label>
      <label class="switch-row"><span>Vibration<small>Kurzes Feedback beim Antippen</small></span><input type="checkbox" id="optVib"><i></i></label>
    </div>

    <div class="card">
      <h2>Modus</h2>
      <div class="stepper">
        <span class="lbl">Legs</span>
        <div class="ctl"><button class="round" data-step="legs" data-d="-1">−</button><b id="legsVal"></b><button class="round" data-step="legs" data-d="1">+</button></div>
      </div>
      <div class="stepper">
        <span class="lbl">Sets</span>
        <div class="ctl"><button class="round" data-step="sets" data-d="-1">−</button><b id="setsVal"></b><button class="round" data-step="sets" data-d="1">+</button></div>
      </div>
    </div>

    <div class="card">
      <h2>Spieler</h2>
      <ul id="plist"></ul>
      <form id="addForm" autocomplete="off">
        <input id="pname" type="text" placeholder="Name eingeben" maxlength="16" enterkeyhint="done" autocapitalize="words">
        <button type="submit" aria-label="Spieler hinzufügen">+</button>
      </form>
      <div id="recent" class="chips"></div>
    </div>
  </div>
  <footer class="bottom"><button id="startBtn" class="btn primary big">Spiel starten</button></footer>
</section>

<!-- ================= SPIEL ================= -->
<section id="game" class="screen hidden">
  <div class="gtop">
    <button id="menuBtn" class="icon" aria-label="Menü">☰</button>
    <button id="inputBtn" class="icon" aria-label="Eingabeart wechseln"></button>
    <div id="matchInfo"></div>
    <div class="zoomctl" id="zoomctl">
      <button id="zoomOut" class="icon" aria-label="Verkleinern">−</button>
      <button id="zoomIn" class="icon" aria-label="Vergrößern">+</button>
      <button id="zoomReset" class="icon" aria-label="Zoom zurücksetzen">⤢</button>
    </div>
    <div id="modeInfo"></div>
  </div>
  <div id="cards" class="cards"></div>
  <div class="active">
    <div class="aleft">
      <div id="aName"></div>
      <div id="aScore"></div>
      <div id="aStats"></div>
    </div>
    <div class="aright">
      <div class="darts"><span class="d" id="d0"></span><span class="d" id="d1"></span><span class="d" id="d2"></span></div>
      <div id="vSum"></div>
    </div>
  </div>
  <div id="checkout"></div>
  <div class="inputArea">
    <div class="boardwrap" id="boardwrap">
      <svg id="board" viewBox="-219 -219 438 438" aria-label="Dartscheibe"></svg>
    </div>
    <div class="keypad hidden" id="keypad">
      <div class="kmods" id="kmods">
        <button data-mod="1" class="sgl on">Single</button>
        <button data-mod="2" class="dbl">Double</button>
        <button data-mod="3" class="tpl">Triple</button>
      </div>
      <div class="knums" id="knums"></div>

        <button data-k="25">25</button>
        <button data-k="50">Bull (50)</button>
      </div>

  </div>

</section>

<section id="stats" class="screen hidden">
  <div class="gtop">

      <button class="btn" data-act="stats">📊 Statistik</button>

      <button class="btn" data-act="setup">Zum Startbildschirm (Spiel bleibt gespeichert)</button>
      <button class="btn danger" data-act="quit">Spiel beenden &amp; verwerfen</button>
    </div>
  </div>
</div>

<script>
'use strict';
/* ====================================================================
   Hilfsfunktionen & Speicher
   ==================================================================== */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone = o => JSON.parse(JSON.stringify(o));
const LS = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
const KEY = { settings:'dz.settings', players:'dz.players', recent:'dz.recent', game:'dz.game', history:'dz.history' };
const LEG_OPTS = [1,3,5,7,9,11,13,15];
const SET_OPTS = [1,3,5,7,9];
const UNDO_MAX = 200;

let settings = Object.assign({ start:501, doubleIn:false, doubleOut:true, vibrate:true, numpad:false, legs:1, sets:1 }, LS.get(KEY.settings, {}));
let setupPlayers = LS.get(KEY.players, []);
let recent = LS.get(KEY.recent, []);
let game = null, undoStack = [];
{ const g = LS.get(KEY.game, null); if (g && g.state) { game = g.state; undoStack = g.undo || []; if (!game.log) game.log = []; } }
let history = LS.get(KEY.history, []);   // abgeschlossene/abgebrochene Spiele für die Gesamtstatistik
const HISTORY_MAX = 150;
// Aktuelles Spiel ins Archiv übernehmen (nur wenn mindestens eine Aufnahme gespielt wurde)
function archiveGame(){
  if (!game || !game.log || !game.log.length || game.archived) return;
  history.push({ date:Date.now(), names:game.players.map(p => p.name), s:game.settings,
    winner:game.phase === 'matchWon' ? game.players[game.winner].name : null, log:game.log });
  if (history.length > HISTORY_MAX) history = history.slice(-HISTORY_MAX);
  try { localStorage.setItem(KEY.history, JSON.stringify(history)); }
  catch(e){ history = history.slice(-40); LS.set(KEY.history, history); }
  game.archived = true;
}
function discardGame(){ archiveGame(); game = null; undoStack = []; saveGame(); }

const saveSettings = () => LS.set(KEY.settings, settings);
const savePlayers  = () => LS.set(KEY.players, setupPlayers);
function saveGame(){
  if (!game) { LS.del(KEY.game); return; }
  try { localStorage.setItem(KEY.game, JSON.stringify({ state:game, undo:undoStack })); }
  catch(e){ // Speicher voll -> Undo-Verlauf kürzen
    undoStack = undoStack.slice(-30); LS.set(KEY.game, { state:game, undo:undoStack });
  }
}
function vib(ms){ if (settings.vibrate && navigator.vibrate) { try{ navigator.vibrate(ms); }catch(e){} } }
const firstTo = bo => Math.ceil(bo / 2);

/* ====================================================================
   Dartscheibe (SVG)
   ==================================================================== */
const ORDER = [20,1,18,4,13,6,10,15,2,17,3,19,7,16,8,11,14,9,12,5];
// Radien (Ringe leicht verbreitert, damit Triple/Double sicher treffbar sind)
const R = { bull:12, obull:27, tIn:90, tOut:121, dIn:158, dOut:191, num:205 };
const COL = { dark:'#1c1c1c', light:'#e9ddc1', red:'#d4382c', green:'#1d8a4b', wire:'#9a9a9a' };

function pol(r, deg){ const a = deg * Math.PI / 180; return [ (r*Math.cos(a)).toFixed(2), (r*Math.sin(a)).toFixed(2) ]; }
function sector(r1, r2, a1, a2){
  const [x1,y1] = pol(r2,a1), [x2,y2] = pol(r2,a2), [x3,y3] = pol(r1,a2), [x4,y4] = pol(r1,a1);
  return `M${x1} ${y1}A${r2} ${r2} 0 0 1 ${x2} ${y2}L${x3} ${y3}A${r1} ${r1} 0 0 0 ${x4} ${y4}Z`;
}
function buildBoard(){
  const svg = $('#board');
  let h = `<circle r="218" fill="#0f0f0f"/><circle r="${R.dOut+1}" fill="${COL.wire}"/>`;
  ORDER.forEach((n, i) => {
    const a1 = -90 + i*18 - 9, a2 = a1 + 18, even = i % 2 === 0;
    const single = even ? COL.dark : COL.light, ring = even ? COL.red : COL.green;
    const st = `stroke="${COL.wire}" stroke-width="0.8"`;
    h += `<path id="s-in-${n}"  d="${sector(R.obull,R.tIn,a1,a2)}" fill="${single}" ${st}/>`;
    h += `<path id="t-${n}"     d="${sector(R.tIn,R.tOut,a1,a2)}"  fill="${ring}"   ${st}/>`;
    h += `<path id="s-out-${n}" d="${sector(R.tOut,R.dIn,a1,a2)}"  fill="${single}" ${st}/>`;
    h += `<path id="d-${n}"     d="${sector(R.dIn,R.dOut,a1,a2)}"  fill="${ring}"   ${st}/>`;
  });
  h += `<circle id="b25" r="${R.obull}" fill="${COL.green}" stroke="${COL.wire}" stroke-width="0.8"/>`;
  h += `<circle id="b50" r="${R.bull}"  fill="${COL.red}"   stroke="${COL.wire}" stroke-width="0.8"/>`;
  h += `<g id="nums" pointer-events="none">` + ORDER.map(n =>
    `<g><circle r="0" fill="rgba(0,0,0,.72)" stroke="rgba(255,255,255,.55)"/><text fill="#fff" font-weight="800" text-anchor="middle" dominant-baseline="central">${n}</text></g>`).join('') + `</g>`;
  h += `<g id="marks"></g>`;
  svg.innerHTML = h;

  svg.addEventListener('pointerdown', onPtrDown, { passive:false });
  svg.addEventListener('pointermove', onPtrMove, { passive:false });
  svg.addEventListener('pointerup', onPtrUp, { passive:false });
  svg.addEventListener('pointercancel', onPtrCancel);
  svg.addEventListener('wheel', e => { e.preventDefault(); zoomAt(e.clientX, e.clientY, e.deltaY < 0 ? 1.15 : 1/1.15); }, { passive:false });
  ['touchstart','touchmove','touchend','gesturestart','dblclick','contextmenu'].forEach(ev =>
    svg.addEventListener(ev, e => e.preventDefault(), { passive:false }));
}

/* ---------- Zoom & Gesten ----------
   1 Finger tippen  = Dart werfen
   2 Finger         = Zoomen (Pinch) und Verschieben
   1 Finger ziehen  = Verschieben (nur wenn gezoomt)              */
const VB = 438, ZMAX = 4;
const zoom = { s:1, cx:0, cy:0 };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function applyZoom(){
  zoom.s = clamp(zoom.s, 1, ZMAX);
  const half = VB / 2 / zoom.s, lim = VB / 2 - half;
  zoom.cx = clamp(zoom.cx, -lim, lim); zoom.cy = clamp(zoom.cy, -lim, lim);
  $('#board').setAttribute('viewBox', `${zoom.cx - half} ${zoom.cy - half} ${2 * half} ${2 * half}`);
  renderNums();
  $('#zoomOut').disabled = zoom.s <= 1.001;
  $('#zoomReset').disabled = zoom.s <= 1.001;
  $('#zoomIn').disabled = zoom.s >= ZMAX - .001;
}
/* Zahlen wandern beim Zoomen mit: Jede Zahl sitzt auf der Mittellinie ihres Segments,
   außen im Zahlenring – oder, wenn der nicht sichtbar ist, am sichtbaren Rand des Ausschnitts. */
function renderNums(){
  const svg = $('#board'), g = $('#nums'); if (!g) return;
  const rc = svg.getBoundingClientRect();
  if (!rc.width || !rc.height) return;
  const a = toBoard(rc.left, rc.top), b = toBoard(rc.right, rc.bottom);
  const s = zoom.s, fs = (s > 1.001 ? 26 : 23) / s;           // gleichbleibende Größe auf dem Bildschirm
  const pad = fs * 0.95;
  const x0 = a.x + pad, x1 = b.x - pad, y0 = a.y + pad, y1 = b.y - pad;
  [...g.children].forEach((el, i) => {
    const ang = (-90 + i * 18) * Math.PI / 180, ux = Math.cos(ang), uy = Math.sin(ang);
    let tmin = 0, tmax = Infinity;
    for (const [u, lo, hi] of [[ux, x0, x1], [uy, y0, y1]]) {
      if (Math.abs(u) < 1e-9) { if (lo > 0 || hi < 0) tmax = -1; continue; }
      let t1 = lo / u, t2 = hi / u; if (t1 > t2) [t1, t2] = [t2, t1];
      tmin = Math.max(tmin, t1); tmax = Math.min(tmax, t2);
    }
    const full = s <= 1.001;                                   // ungezoomt: klassischer Zahlenring
    const r = full ? R.num : Math.min(R.num, tmax);
    const vis = full || (tmax >= tmin && r >= tmin && r >= R.obull + fs * 0.8);
    el.style.display = vis ? '' : 'none';
    if (!vis) return;
    const x = r * ux, y = r * uy, inside = r < R.dOut + fs * 0.5;
    const c = el.firstChild, t = el.lastChild;
    c.setAttribute('cx', x); c.setAttribute('cy', y);
    c.setAttribute('r', inside ? fs * 0.85 : 0); c.setAttribute('stroke-width', 1.5 / s);
    t.setAttribute('x', x); t.setAttribute('y', y); t.setAttribute('font-size', fs);
  });
}
function boardMetrics(){
  const r = $('#board').getBoundingClientRect();
  return { mx:r.left + r.width / 2, my:r.top + r.height / 2, k:Math.min(r.width, r.height) * zoom.s / VB };
}
function toBoard(x, y){
  const svg = $('#board'), p = svg.createSVGPoint(); p.x = x; p.y = y;
  return p.matrixTransform(svg.getScreenCTM().inverse());
}
// Zoomt so, dass der Punkt unter (x,y) an derselben Bildschirmstelle bleibt
function zoomTo(s, anchorBoard, x, y){
  zoom.s = clamp(s, 1, ZMAX);
  const m = boardMetrics();
  zoom.cx = anchorBoard.x - (x - m.mx) / m.k;
  zoom.cy = anchorBoard.y - (y - m.my) / m.k;
  applyZoom();
}
function zoomAt(x, y, f){ zoomTo(zoom.s * f, toBoard(x, y), x, y); }
function zoomCenter(f){ const m = boardMetrics(); zoomAt(m.mx, m.my, f); }
function resetZoom(){ zoom.s = 1; zoom.cx = 0; zoom.cy = 0; applyZoom(); }

const ptrs = new Map();
let gest = null;
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const midOf = (a, b) => ({ x:(a.x + b.x) / 2, y:(a.y + b.y) / 2 });
function onPtrDown(e){
  e.preventDefault();
  try { e.currentTarget.setPointerCapture(e.pointerId); } catch(_){}
  ptrs.set(e.pointerId, { x:e.clientX, y:e.clientY });
  if (ptrs.size === 1) {
    gest = { type:'tap', id:e.pointerId, x0:e.clientX, y0:e.clientY, cx0:zoom.cx, cy0:zoom.cy };
  } else if (ptrs.size === 2) {
    const [a, b] = [...ptrs.values()], m = midOf(a, b);
    gest = { type:'pinch', d0:Math.max(dist(a, b), 1), s0:zoom.s, p0:toBoard(m.x, m.y) };
  }
}
function onPtrMove(e){
  if (!ptrs.has(e.pointerId) || !gest) return;
  e.preventDefault();
  ptrs.set(e.pointerId, { x:e.clientX, y:e.clientY });
  if (gest.type === 'pinch' && ptrs.size >= 2) {
    const [a, b] = [...ptrs.values()], m = midOf(a, b);
    zoomTo(gest.s0 * dist(a, b) / gest.d0, gest.p0, m.x, m.y);
  } else if ((gest.type === 'tap' || gest.type === 'pan') && e.pointerId === gest.id) {
    const dx = e.clientX - gest.x0, dy = e.clientY - gest.y0;
    if (gest.type === 'tap' && zoom.s > 1.001 && Math.hypot(dx, dy) > 12) gest.type = 'pan';
    if (gest.type === 'pan') {
      const k = boardMetrics().k;
      zoom.cx = gest.cx0 - dx / k; zoom.cy = gest.cy0 - dy / k; applyZoom();
    }
  }
}
function onPtrUp(e){
  if (!ptrs.has(e.pointerId)) return;
  e.preventDefault();
  ptrs.delete(e.pointerId);
  if (gest && gest.type === 'tap' && e.pointerId === gest.id && ptrs.size === 0) boardTap(gest.x0, gest.y0);
  if (ptrs.size === 0) gest = null;
  else if (gest && gest.type === 'pinch') gest = { type:'done' };   // restlichen Finger ignorieren
}
function onPtrCancel(e){ ptrs.delete(e.pointerId); if (!ptrs.size) gest = null; }
function boardTap(x, y){
  if (!canThrow()) return;
  const pt = toBoard(x, y), hit = hitTest(pt.x, pt.y);
  if (!hit) return;
  flashField(hit.id); markPoint(pt.x, pt.y);
  throwDart(hit.v, hit.m);
}
function svgPoint(svg, e){
  const p = svg.createSVGPoint(); p.x = e.clientX; p.y = e.clientY;
  return p.matrixTransform(svg.getScreenCTM().inverse());
}
function hitTest(x, y){
  const r = Math.hypot(x, y);
  if (r <= R.bull)  return { v:25, m:2, id:'b50' };
  if (r <= R.obull) return { v:25, m:1, id:'b25' };
  if (r >  R.dOut)  return null;               // Zahlenring: ignorieren
  let ang = Math.atan2(y, x) * 180 / Math.PI + 90; // 0° = oben, im Uhrzeigersinn
  const idx = ((Math.round(ang / 18) % 20) + 20) % 20;
  const n = ORDER[idx];
  if (r <= R.tIn)  return { v:n, m:1, id:'s-in-'+n };
  if (r <= R.tOut) return { v:n, m:3, id:'t-'+n };
  if (r <= R.dIn)  return { v:n, m:1, id:'s-out-'+n };
  return { v:n, m:2, id:'d-'+n };
}
function flashField(id){
  const el = document.getElementById(id); if (!el) return;
  const orig = el.getAttribute('fill');
  if (el.animate) el.animate([{ fill:'#fff36b' }, { fill:'#ffd400', offset:.35 }, { fill:orig }], { duration:450, easing:'ease-out' });
}
function markPoint(x, y){
  const g = $('#marks'), c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
  c.setAttribute('cx', x); c.setAttribute('cy', y); c.setAttribute('r', 7 / zoom.s);
  c.setAttribute('fill', '#00e5ff'); c.setAttribute('stroke', '#fff'); c.setAttribute('stroke-width', 2 / zoom.s);
  c.style.pointerEvents = 'none';
  g.appendChild(c);
  if (c.animate) c.animate([{ opacity:1, transform:'scale(1)' }, { opacity:0 }], { duration:700 }).onfinish = () => c.remove();
  else setTimeout(() => c.remove(), 700);
}

/* ====================================================================
   Checkout-Rechner
   ==================================================================== */
const THROWS = (() => {
  const a = [];
  for (let v = 20; v >= 1; v--) a.push({v, m:3, p:v*3}, {v, m:1, p:v}, {v, m:2, p:v*2});
  a.push({v:25, m:1, p:25}, {v:25, m:2, p:50});
  return a;
})();
const DPREF = {20:0, 16:.1, 18:.3, 12:.4, 10:.45, 8:.5, 14:.7, 6:.8, 4:.9, 2:1};
const setupCost = t => t.v === 25 ? (t.m === 2 ? 3.5 : 2.5) : t.m === 1 ? 1 : t.m === 3 ? (t.v >= 19 ? 1.9 : 2.1) : 3;
const finCost = (t, DO) => DO
  ? (t.v === 25 ? 1.5 : (DPREF[t.v] ?? 1.2))
  : (t.m === 1 ? (t.v === 25 ? .8 : 0) : t.m === 3 ? .5 : (t.v === 25 ? 1 : .6));
const coCache = new Map();
function findCheckout(score, darts, DO){
  const key = score + '|' + darts + '|' + DO;
  if (coCache.has(key)) return coCache.get(key);
  let res = null;
  if (score > 0 && score <= (DO ? 170 : 180) && !(DO && score < 2)) {
    const fins = DO ? THROWS.filter(t => t.m === 2) : THROWS;
    for (let n = 1; n <= darts && !res; n++) {
      let best = null, bc = Infinity;
      const consider = arr => {
        let c = 0, sp = 0;
        for (let i = 0; i < arr.length - 1; i++) { c += setupCost(arr[i]); sp += arr[i].p; }
        c += finCost(arr[arr.length - 1], DO) - sp * 0.02;
        if (c < bc) { bc = c; best = arr; }
      };
      for (const f of fins) {
        const rest = score - f.p; if (rest < 0) continue;
        if (n === 1) { if (rest === 0) consider([f]); }
        else if (n === 2) { for (const a of THROWS) if (a.p === rest) consider([a, f]); }
        else { for (const a of THROWS) for (const b of THROWS) if (a.p >= b.p && a.p + b.p === rest) consider([a, b, f]); }
      }
      res = best;
    }
  }
  coCache.set(key, res);
  return res;
}
function label(v, m){
  if (!m || !v) return '0';
  if (v === 25) return m === 2 ? 'Bull' : '25';
  return (m === 3 ? 'T' : m === 2 ? 'D' : '') + v;
}

/* ====================================================================
   Spiellogik
   ==================================================================== */
function newPlayer(name, s){
  return { name, score:s.start, opened:!s.doubleIn, legs:0, sets:0,
    leg:{ darts:0, points:0 },
    tot:{ darts:0, points:0, visits:0, hi:0, c100:0, c140:0, c180:0, bestCO:0, legsWon:0, busts:0 },
    last:null };
}
function createGame(names, s){
  return { settings:{ start:s.start, doubleIn:s.doubleIn, doubleOut:s.doubleOut, legs:s.legs, sets:s.sets },
    players:names.map(n => newPlayer(n, s)),
    cur:0, legStarter:0, legNo:1, setNo:1, legInSet:1,
    visit:[], visitStart:s.start, visitOpened:!s.doubleIn,
    phase:'play', pending:null, log:[], winner:null, setWon:false, lastCO:0, lastCODarts:0 };
}
let flashBusy = false, flashTimer = null;
const canThrow = () => game && game.phase === 'play' && !game.pending && !flashBusy;

// Undo-Schnappschüsse ohne das (wachsende) Protokoll – nur dessen Länge wird gemerkt
function snapshot(){
  const { log, ...rest } = game, snap = clone(rest);
  snap.logLen = (log || []).length;
  return snap;
}
function restore(snap){
  const log = game.log || [], len = snap.logLen;
  delete snap.logLen;
  snap.log = len == null ? log : log.slice(0, len);
  game = snap;
}
function pushUndo(){
  undoStack.push(snapshot());
  if (undoStack.length > UNDO_MAX) undoStack.splice(0, undoStack.length - UNDO_MAX);
}
function throwDart(v, m){
  if (!canThrow()) return;
  vib(15);
  pushUndo();
  const g = game, s = g.settings, p = g.players[g.cur];
  if (g.visit.length === 0) { g.visitStart = p.score; g.visitOpened = p.opened; }
  const pts = v * m, isDouble = m === 2;
  let eff = pts;
  if (s.doubleIn && !p.opened) { if (isDouble) p.opened = true; else eff = 0; }
  const ns = p.score - eff;
  const bust = ns < 0 || (s.doubleOut && ns === 1) || (ns === 0 && s.doubleOut && !isDouble);
  g.visit.push({ l:label(v, m), p:pts, e:eff, v, m, b:p.score });

  if (bust) {
    p.score = g.visitStart; p.opened = g.visitOpened;
    g.pending = { bust:true };            // warten auf Bestätigung
    vib([40,40,120]);
  } else {
    p.score = ns;
    if (ns === 0) { endVisit(false, true); legWon(); }
    else if (g.visit.length === 3) g.pending = { bust:false };  // warten auf Bestätigung
  }
  saveGame(); renderGame();
}
function confirmVisit(){
  if (!game || !game.pending || game.phase !== 'play') return;
  const bust = game.pending.bust;
  game.pending = null;
  endVisit(bust, false);
  vib(20);
  saveGame(); renderGame();
}
function endVisit(bust, checkout){
  const g = game, p = g.players[g.cur], n = g.visit.length;
  const total = bust ? 0 : g.visit.reduce((a, d) => a + d.e, 0);
  p.leg.darts += n; p.leg.points += total;
  p.tot.darts += n; p.tot.points += total; p.tot.visits++;
  if (bust) p.tot.busts++;
  else {
    p.tot.hi = Math.max(p.tot.hi, total);
    if (total === 180) p.tot.c180++; else if (total >= 140) p.tot.c140++; else if (total >= 100) p.tot.c100++;
  }
  p.last = { d:g.visit.map(d => d.l), t:total, bust };
  // Protokoll für die Statistik
  if (!g.log) g.log = [];
  g.log.push({ p:g.cur, leg:g.legNo, vi:p.leg.visits || 0, t:total, bust:bust ? 1 : 0, co:checkout ? 1 : 0,
    d:g.visit.map(d => [d.v ?? 0, d.m ?? 0, d.b ?? 0, d.e]) });
  p.leg.visits = (p.leg.visits || 0) + 1;
  g.visit = [];
  if (checkout) return;
  g.cur = (g.cur + 1) % g.players.length;
}
function legWon(){
  const g = game, s = g.settings, p = g.players[g.cur];
  g.lastCO = g.visitStart; g.lastCODarts = p.leg.darts;
  p.tot.bestCO = Math.max(p.tot.bestCO, g.visitStart);
  p.tot.legsWon++; p.legs++;
  g.winner = g.cur; g.setWon = false;
  if (p.legs >= firstTo(s.legs)) {
    p.sets++;
    if (s.sets > 1) g.setWon = true;
    if (p.sets >= firstTo(s.sets)) { g.phase = 'matchWon'; vib([60,60,60,60,200]); return; }
    g.players.forEach(q => q.legs = 0);
    g.setNo++; g.legInSet = 0;
  }
  g.phase = 'legWon'; vib([50,50,150]);
}
function startNextLeg(){
  const g = game, s = g.settings;
  g.legNo++; g.legInSet++;
  g.legStarter = (g.legStarter + 1) % g.players.length;
  g.players.forEach(p => { p.score = s.start; p.opened = !s.doubleIn; p.leg = { darts:0, points:0 }; p.last = null; });
  g.cur = g.legStarter; g.visit = []; g.phase = 'play'; g.pending = null; g.winner = null; g.setWon = false;
  undoStack = [];
  saveGame(); renderGame();
}
function restartLeg(){
  // Leg auf Anfang zurücksetzen (Statistik dieses Legs wird zurückgenommen)
  if (!undoStack.length) return;
  const legStart = undoStack.findIndex(st => st.legNo === game.legNo);
  if (legStart < 0) return;
  restore(undoStack[legStart]); undoStack = undoStack.slice(0, legStart);
  hideFlash(); saveGame(); renderGame();
}
function undo(){
  if (!undoStack.length) return;
  hideFlash();
  restore(undoStack.pop());
  vib(30);
  saveGame(); renderGame();
}

/* ====================================================================

const avg = (pts, d) => d ? (pts / d * 3).toFixed(1) : '–';
function renderGame(){
  if (!game) return;
  const g = game, s = g.settings, n = g.players.length, cur = g.players[g.cur];
  // Kopfzeile
  const legPart = s.legs > 1 ? `Leg ${g.legInSet} · Best of ${s.legs}` : `Leg ${g.legNo}`;
  $('#matchInfo').textContent = s.sets > 1 ? `Set ${g.setNo} · ${legPart}` : legPart;
  $('#modeInfo').textContent = `${s.start}${s.doubleIn ? ' · DI' : ''}${s.doubleOut ? ' · DO' : ' · SO'}`;

  // Spielerkarten
  const showLegs = s.legs > 1 || s.sets > 1;
  $('#cards').innerHTML = g.players.map((p, i) => {
    const active = i === g.cur && g.phase === 'play';
    const darts = p.leg.darts + (i === g.cur ? g.visit.length : 0);
    const badge = showLegs ? `<span class="lg">${s.sets > 1 ? p.sets + 'S ' : ''}${p.legs}L</span>` : '';
    const last = p.last ? (p.last.bust ? '<span class="bust">BUST</span>' : p.last.t) + ' · ' + esc(p.last.d.join(' ')) : '–';
    return `<div class="pc${active ? ' on' : ''}" data-i="${i}">
      <div class="pn"><span>${esc(p.name)}</span>${badge}</div>
      <div class="ps">${p.score}</div>
      <div class="pm">Ø ${avg(p.tot.points, p.tot.darts)} · ${darts} Darts</div>
      <div class="pl">Letzte: ${last}</div></div>`;
  }).join('');
  const on = $('#cards .pc.on');
  if (on && n > 2) on.scrollIntoView({ inline:'center', block:'nearest', behavior:'smooth' });
  document.querySelectorAll('#cards .pc').forEach(el => el.style.flexBasis = n <= 3 ? '0' : '30%');

  // Aktiver Spieler
  $('#aName').textContent = cur.name;
  $('#aScore').textContent = cur.score;
  $('#aStats').textContent = `Ø ${avg(cur.leg.points, cur.leg.darts)} (Leg) · ${cur.leg.darts + g.visit.length} Darts`;
  for (let i = 0; i < 3; i++) {
    const el = $('#d' + i), d = g.visit[i];
    el.textContent = d ? d.l : '';
    el.className = 'd' + (!d && i === g.visit.length ? ' next' : '') + (d && d.p === 0 ? ' zero' : '') + (d && d.p > 0 && d.e === 0 ? ' void' : '');
  }
  const sum = g.visit.reduce((a, d) => a + d.e, 0);
  $('#vSum').innerHTML = `<small>Summe </small>${sum}`;

  // Checkout
  const co = $('#checkout'); co.className = '';
  const left = 3 - g.visit.length;
  if (g.phase !== 'play') co.innerHTML = '';
  else if (s.doubleIn && !cur.opened) { co.className = 'info'; co.innerHTML = 'Double In – zuerst ein Double treffen'; }
  else {
    const route = findCheckout(cur.score, left, s.doubleOut);
    co.innerHTML = route ? `<small>Checkout</small>${route.map(t => label(t.v, t.m)).join(' · ')}` : '';
  }
  $('#undoBtn').disabled = !undoStack.length;

  // Aufnahme beendet -> auf Bestätigung warten
  const cf = $('#confirm'), mb = $('#missBtn');
  if (g.pending && g.phase === 'play') {
    const bust = g.pending.bust, next = g.players[(g.cur + 1) % n].name;
    cf.className = 'confirm' + (bust ? ' bust' : sum === 180 ? ' max' : '');
    cf.innerHTML = `<div class="cname">${esc(cur.name)}</div>
      <div class="cdarts">${g.visit.map(d => `<span>${esc(d.l)}</span>`).join('')}</div>
      <div class="ctotal">${bust ? 'BUST' : sum}</div>
      <div class="crest">Rest: <b>${cur.score}</b></div>
      <button class="cgo" data-act="confirm">Weiter ▶ ${esc(next)}</button>
      <div class="chint">Falsch eingegeben? „↶ Zurück“ nimmt den letzten Dart zurück.</div>`;
    mb.textContent = 'Weiter ▶'; mb.classList.add('go');
  } else {
    cf.className = 'confirm hidden'; cf.innerHTML = '';
    mb.textContent = 'Daneben (0)'; mb.classList.remove('go');
  }
  renderInputMode();
  renderWin();
}

function showFlash(main, sub, cls, ms, next){
  const f = $('#flash');
  f.className = 'overlay flash ' + cls;
  f.innerHTML = `<div class="fbox"><div class="fsub">${esc(sub)}</div><div class="fmain">${esc(main)}</div>${next ? `<div class="fnext">Weiter: <b>${esc(next)}</b></div>` : ''}</div>`;
  flashBusy = true;
  clearTimeout(flashTimer);
  flashTimer = setTimeout(hideFlash, ms);
}
function hideFlash(){
  clearTimeout(flashTimer); flashBusy = false;
  $('#flash').classList.add('hidden');
}

  const g = game, s = g.settings, p = g.players[g.winner], match = g.phase === 'matchWon';

  const rows = g.players.map((q, i) => `<tr class="${i === g.winner ? 'win' : ''}">
      <td>${esc(q.name)}</td>
      ${multi ? `<td>${s.sets > 1 ? q.sets + ' / ' : ''}${s.sets > 1 && !match && g.setWon ? q.tot.legsWon : q.legs}</td>` : ''}
      <td>${avg(q.leg.points, q.leg.darts)}</td>
      <td>${avg(q.tot.points, q.tot.darts)}</td>
      <td>${q.leg.darts}</td>
      <td>${q.tot.hi}</td>
      <td>${q.tot.c180}</td>

  const btns = match
    ? `<button class="btn primary big" data-act="rematch">Neues Spiel (gleiche Spieler)</button>
       <button class="btn" data-act="setup">Neues Spiel (Einstellungen)</button>`
    : `<button class="btn primary big" data-act="nextLeg">Neues Leg</button>
       <button class="btn" data-act="setup">Neues Spiel</button>`;
  const statBtn = `<button class="btn" data-act="stats">📊 Statistik</button>`;
  w.innerHTML = `<div class="sheet">
      <div class="trophy">${match ? '🏆' : '🎯'}</div>
      <h3>${esc(p.name)}</h3>
      <div class="sub">${title}<br>Checkout <b>${g.lastCO}</b> mit ${g.lastCODarts} Darts</div>
      <table class="stats">${head}${rows}</table>
      <div class="btns">${btns}${statBtn}
        <button class="btn" data-act="undo">↶ Letzten Dart zurücknehmen</button>
      </div></div>`;

        <button data-mv="${i}" data-d="-1" ${i === 0 ? 'disabled style="opacity:.3"' : ''} aria-label="nach oben">▲</button>
        <button data-mv="${i}" data-d="1" ${i === setupPlayers.length - 1 ? 'disabled style="opacity:.3"' : ''} aria-label="nach unten">▼</button>
        <button class="del" data-del="${i}" aria-label="löschen">✕</button></li>`).join('')

    : '';
  $('#resumeBtn').classList.toggle('hidden', !game);

function addPlayer(name){
  name = (name || '').trim().slice(0, 16);
  if (!name) return;
  if (setupPlayers.some(n => n.toLowerCase() === name.toLowerCase())) { vib(80); return; }
  setupPlayers.push(name); savePlayers(); renderSetup();
}
function startGame(names){
  names = names || setupPlayers;
  if (!names.length) return;
  if (game && game.phase === 'play' && names === setupPlayers && !confirm('Das laufende Spiel wird verworfen. Neues Spiel starten?')) return;
  recent = [...names, ...recent.filter(n => !names.includes(n))].slice(0, 16);
  LS.set(KEY.recent, recent);
  archiveGame();
  game = createGame(names, settings);
  undoStack = [];
  saveGame(); showScreen('game');
}

/* ====================================================================
   Statistik
   ==================================================================== */
let stScope = null, stPlayer = null, stLegSel = -1;
const pct = (a, b) => b ? (a / b * 100).toFixed(1) + ' %' : '–';
const oneDartFinish = (b, DO) => b > 0 && THROWS.some(t => t.p === b && (!DO || t.m === 2));
const BUCKETS = [['180', 180, 180], ['140–179', 140, 179], ['100–139', 100, 139], ['60–99', 60, 99], ['40–59', 40, 59], ['20–39', 20, 39], ['0–19', 0, 19]];

function stEntries(scope){
  const list = scope === 'all' ? history.slice() : [];
  if (game && game.log && game.log.length && !game.archived)
    list.push({ names:game.players.map(p => p.name), s:game.settings, log:game.log, current:true,
      winner:game.phase === 'matchWon' ? game.players[game.winner].name : null });
  return list;
}
function stNames(entries){
  const cnt = new Map();
  entries.forEach(en => en.log.forEach(v => { const n = en.names[v.p]; cnt.set(n, (cnt.get(n) || 0) + v.d.length); }));
  const cur = game ? game.players.map(p => p.name).filter(n => cnt.has(n)) : [];
  return [...cur, ...[...cnt.keys()].filter(n => !cur.includes(n)).sort((a, b) => cnt.get(b) - cnt.get(a))];
}
function statsFor(name, entries){
  const S = { games:0, wins:0, finished:0, darts:0, pts:0, f9d:0, f9p:0, visits:0, hi:0, c180:0, c140:0, c100:0, c60:0,
    busts:0, att:0, hits:0, hf:0, f100:0, miss:0, sgl:0, dbl:0, tpl:0, b25:0, b50:0,
    buckets:BUCKETS.map(() => 0), fields:{}, outs:{}, legs:[] };
  entries.forEach((en, gi) => {
    const pi = en.names.indexOf(name);
    if (pi < 0 || !en.log.some(v => v.p === pi)) return;
    S.games++;
    if (!en.current || en.winner) S.finished += en.winner ? 1 : 0;
    if (en.winner === name) S.wins++;
    const DO = en.s.doubleOut, legs = new Map();
    for (const v of en.log) {
      if (v.p !== pi) continue;
      const n = v.d.length;
      S.darts += n; S.pts += v.t; S.visits++;
      if (v.vi < 3) { S.f9d += n; S.f9p += v.t; }
      if (v.bust) S.busts++;
      else {
        S.hi = Math.max(S.hi, v.t);
        if (v.t === 180) S.c180++; else if (v.t >= 140) S.c140++; else if (v.t >= 100) S.c100++; else if (v.t >= 60) S.c60++;
        const bi = BUCKETS.findIndex(([, lo, hi]) => v.t >= lo && v.t <= hi); if (bi >= 0) S.buckets[bi]++;
      }
      for (const [dv, dm, b] of v.d) {
        if (!dv || !dm) S.miss++;
        else {
          const k = dv === 25 ? (dm === 2 ? 'b50' : 'b25') : (dm === 3 ? 't' : dm === 2 ? 'd' : 's') + dv;
          S.fields[k] = (S.fields[k] || 0) + 1;
          if (dv === 25) dm === 2 ? S.b50++ : S.b25++;
          else if (dm === 3) S.tpl++; else if (dm === 2) S.dbl++; else S.sgl++;
        }
        if (oneDartFinish(b, DO)) S.att++;
      }
      let L = legs.get(v.leg);
      if (!L) { L = { leg:v.leg, game:gi, darts:0, pts:0, won:false, co:0, current:!!en.current }; legs.set(v.leg, L); }
      L.darts += n; L.pts += v.t;
      if (v.co) {
        S.hits++; S.hf = Math.max(S.hf, v.t); if (v.t >= 100) S.f100++;
        const last = v.d[v.d.length - 1], lab = label(last[0], last[1]);
        S.outs[lab] = (S.outs[lab] || 0) + 1;
        L.won = true; L.co = v.t;
      }
    }
    S.legs.push(...legs.values());
  });
  const won = S.legs.filter(l => l.won);
  S.legsWon = won.length;
  S.bestLeg = won.length ? Math.min(...won.map(l => l.darts)) : 0;
  S.avgLegDarts = won.length ? (won.reduce((a, l) => a + l.darts, 0) / won.length).toFixed(1) : '–';
  return S;
}

function tile(label, value, sub, cls){ return `<div class="tile ${cls || ''}"><div><div class="tl">${label}</div>${sub ? `<div class="ts">${sub}</div>` : ''}</div><div class="tv">${value}</div></div>`; }
function tileV(label, value, sub){ return `<div class="tile"><div class="tl">${label}</div><div class="tv">${value}</div>${sub ? `<div class="ts">${sub}</div>` : ''}</div>`; }
function barRows(rows, max){
  return `<div class="bars">${rows.map(([l, n, sub, bad]) => `<div class="bl">${l}</div>
    <div class="bt"><div class="bf${bad ? ' bad' : ''}" style="width:${max ? n / max * 100 : 0}%"></div></div>
    <div class="bn">${n}${sub ? ` <small>${sub}</small>` : ''}</div>`).join('')}</div>`;
}
function heatColor(c, max){
  if (!c) return '#161b22';
  const t = Math.sqrt(c / max), a = [0x2a, 0x33, 0x40], b = [0xff, 0xcc, 0x33];
  return '#' + a.map((x, i) => Math.round(x + (b[i] - x) * t).toString(16).padStart(2, '0')).join('');
}
function heatBoard(S){
  const max = Math.max(1, ...Object.values(S.fields));
  const f = k => S.fields[k] || 0;
  let h = `<circle r="218" fill="#0f0f0f"/>`;
  ORDER.forEach((n, i) => {
    const a1 = -90 + i * 18 - 9, a2 = a1 + 18, st = `stroke="#3a4350" stroke-width="1"`;
    const seg = (k, r1, r2) => `<path data-f="${k}" d="${sector(r1, r2, a1, a2)}" fill="${heatColor(f(k), max)}" ${st}/>`;
    h += seg('s' + n, R.obull, R.tIn) + seg('t' + n, R.tIn, R.tOut) + seg('s' + n, R.tOut, R.dIn) + seg('d' + n, R.dIn, R.dOut);
    const [tx, ty] = pol(R.num, -90 + i * 18);
    h += `<text x="${tx}" y="${ty}" fill="#c9d1d9" font-size="22" font-weight="800" text-anchor="middle" dominant-baseline="central" pointer-events="none">${n}</text>`;
  });
  h += `<circle data-f="b25" r="${R.obull}" fill="${heatColor(f('b25'), max)}" stroke="#3a4350"/>`;
  h += `<circle data-f="b50" r="${R.bull}" fill="${heatColor(f('b50'), max)}" stroke="#3a4350"/>`;
  return `<svg id="heat" viewBox="-219 -219 438 438">${h}</svg>
    <div class="heatscale">selten <span class="g" style="background:linear-gradient(90deg,${heatColor(1, 100)},${heatColor(100, 100)})"></span> oft</div>
    <div class="heatcap" id="heatcap">Feld antippen für Details</div>`;
}
const fieldName = k => k === 'b50' ? 'Bull (50)' : k === 'b25' ? '25' : (k[0] === 't' ? 'Triple ' : k[0] === 'd' ? 'Double ' : 'Single ') + k.slice(1);

function renderStats(){
  const body = $('#statsBody');
  if (!stScope) stScope = game && game.log && game.log.length && !game.archived ? 'game' : 'all';
  const entries = stEntries(stScope), names = stNames(entries);
  if (!names.includes(stPlayer)) stPlayer = names[0] || null;
  const hasGame = game && game.log && game.log.length && !game.archived;
  let h = `<div class="seg st-seg" id="stScope">
    <button data-sc="game" class="${stScope === 'game' ? 'on' : ''}" ${hasGame ? '' : 'disabled style="opacity:.35"'}>Aktuelles Spiel</button>
    <button data-sc="all" class="${stScope === 'all' ? 'on' : ''}">Gesamt</button></div>`;
  if (!stPlayer) { body.innerHTML = h + `<div class="empty-st">Noch keine Daten.<br>Spiele ein paar Aufnahmen – die Statistik füllt sich automatisch.</div>`; return; }

  h += `<div class="st-chips" id="stChips">${names.map(n => `<button class="chip${n === stPlayer ? ' on' : ''}" data-pl="${esc(n)}">${esc(n)}</button>`).join('')}</div>`;

  // Vergleichstabelle
  if (names.length > 1) {
    const rows = names.map(n => { const q = statsFor(n, entries); return `<tr data-pl="${esc(n)}" class="${n === stPlayer ? 'win' : ''}">
      <td>${esc(n)}</td><td>${avg(q.pts, q.darts)}</td><td>${avg(q.f9p, q.f9d)}</td><td>${pct(q.hits, q.att)}</td>
      <td>${q.c180}</td><td>${q.hf || '–'}</td><td>${q.legsWon}/${q.legs.length}</td></tr>`; }).join('');
    h += `<div class="card cmp"><h2>Vergleich</h2><table class="stats"><tr><th>Spieler</th><th>Ø</th><th>First 9</th><th>CO %</th><th>180</th><th>HF</th><th>Legs</th></tr>${rows}</table></div>`;
  }

  const S = statsFor(stPlayer, entries);
  h += `<div class="tiles">
    ${tile('3-Dart-Durchschnitt', avg(S.pts, S.darts), `${S.darts} Darts · ${S.visits} Aufnahmen`, 'hero')}
    ${tileV('First 9 Ø', avg(S.f9p, S.f9d), 'erste 9 Darts je Leg')}
    ${tileV('Checkout-Quote', pct(S.hits, S.att), `${S.hits} von ${S.att} Versuchen`)}
    ${tileV('Höchstes Finish', S.hf || '–', `${S.f100}× 100+ Finish`)}
    ${tileV('Höchste Aufnahme', S.hi || '–', `${S.busts} Bust${S.busts === 1 ? '' : 's'}`)}
    ${tileV('Legs gewonnen', `${S.legsWon}<small style="font-size:18px;color:var(--muted)"> / ${S.legs.length}</small>`, pct(S.legsWon, S.legs.length))}
    ${tileV('Bestes Leg', S.bestLeg ? S.bestLeg + ' Darts' : '–', `Ø ${S.avgLegDarts} Darts je gewonnenem Leg`)}
    ${stScope === 'all' ? tileV('Spiele', S.games, `${S.wins} gewonnen`) : ''}
    ${tileV('Punkte pro Dart', S.darts ? (S.pts / S.darts).toFixed(2) : '–', `${S.pts} Punkte gesamt`)}
  </div>`;

  // Aufnahmen
  const vMax = Math.max(1, ...S.buckets, S.busts);
  h += `<div class="card"><h2>Aufnahmen</h2>
    <div class="tiles" style="grid-template-columns:repeat(4,1fr);margin-bottom:12px">
      ${tileV('180', S.c180)}${tileV('140+', S.c140)}${tileV('100+', S.c100)}${tileV('60+', S.c60)}</div>
    ${barRows([...BUCKETS.map(([l], i) => [l, S.buckets[i], pct(S.buckets[i], S.visits)]), ['Bust', S.busts, pct(S.busts, S.visits), true]], vMax)}
  </div>`;

  // Doppel / Checkout
  const outs = Object.entries(S.outs).sort((a, b) => b[1] - a[1]);
  h += `<div class="card"><h2>Checkout</h2><div class="kv">
      <div>Checkout-Quote</div><div>${pct(S.hits, S.att)}</div>
      <div>Treffer / Versuche aufs Finish</div><div>${S.hits} / ${S.att}</div>
      <div>Höchstes Finish</div><div>${S.hf || '–'}</div>
      <div>Finishes ab 100</div><div>${S.f100}</div>
      <div>Ø Darts pro gewonnenem Leg</div><div>${S.avgLegDarts}</div></div>
    ${outs.length ? `<h2 style="margin-top:14px">Lieblings-Finish-Felder</h2><div class="outs">${outs.slice(0, 8).map(([k, c]) => `<span>${esc(k)}<small>${c}×</small></span>`).join('')}</div>` : ''}
    <div class="ts" style="color:var(--muted);font-size:12px;margin-top:10px">Ein Versuch zählt jeder Dart, der mit einem einzigen Dart hätte checken können (z. B. Rest 40 → D20).</div>
  </div>`;

  // Treffer
  const thr = S.darts;
  h += `<div class="card"><h2>Trefferbild</h2>${heatBoard(S)}
    <div style="height:12px"></div>
    ${barRows([['Single', S.sgl, pct(S.sgl, thr)], ['Double', S.dbl, pct(S.dbl, thr)], ['Triple', S.tpl, pct(S.tpl, thr)],
      ['25', S.b25, pct(S.b25, thr)], ['Bull', S.b50, pct(S.b50, thr)], ['Daneben', S.miss, pct(S.miss, thr), true]],
      Math.max(1, S.sgl, S.dbl, S.tpl, S.b25, S.b50, S.miss))}
  </div>`;

  // Leg-Verlauf
  const legs = S.legs.slice(-30);
  if (legs.length) {
    const aMax = Math.max(...legs.map(l => l.darts ? l.pts / l.darts * 3 : 0), 1);
    h += `<div class="card"><h2>Ø pro Leg (letzte ${legs.length})</h2>
      <div class="trend" id="trend">${legs.map((l, i) => { const a = l.darts ? l.pts / l.darts * 3 : 0;
        return `<button data-i="${i}" class="${l.won ? 'won' : 'lost'}${i === stLegSel ? ' sel' : ''}" aria-label="Leg ${i + 1}"><span style="height:${Math.max(2, a / aMax * 100)}%"></span></button>`; }).join('')}</div>
      <div class="legend"><span><i style="background:var(--accent)"></i>gewonnen</span><span><i style="background:#6b7682"></i>verloren / offen</span></div>
      <div class="trendcap" id="trendcap">Balken antippen für Details</div></div>`;
  }
  if (stScope === 'all') h += `<button class="btn danger" id="stReset" style="width:100%;margin-top:4px">Gesamtstatistik löschen</button>`;
  body.innerHTML = h;
  body._legs = legs; body._S = S;
}
function openStats(){ statsReturn = currentScreen === 'game' ? 'game' : 'setup'; stScope = null; stLegSel = -1; showScreen('stats'); $('#statsBody').scrollTop = 0; }
$('#setupStats').addEventListener('click', openStats);
$('#statsBack').addEventListener('click', () => showScreen(statsReturn === 'game' && game ? 'game' : 'setup'));
$('#statsBody').addEventListener('click', e => {
  const body = $('#statsBody');
  const sc = e.target.closest('[data-sc]'); if (sc && !sc.disabled) { stScope = sc.dataset.sc; stLegSel = -1; renderStats(); return; }
  const pl = e.target.closest('[data-pl]'); if (pl) { stPlayer = pl.dataset.pl; stLegSel = -1; renderStats(); return; }
  const fld = e.target.closest('[data-f]');
  if (fld) {
    const k = fld.dataset.f, S = body._S, c = S.fields[k] || 0;
    $('#heatcap').innerHTML = `<b>${fieldName(k)}</b>: ${c}× getroffen (${pct(c, S.darts)} aller Darts)`;
    return;
  }
  const bar = e.target.closest('#trend button');
  if (bar) {
    stLegSel = +bar.dataset.i; const l = body._legs[stLegSel];
    document.querySelectorAll('#trend button').forEach((b, i) => b.classList.toggle('sel', i === stLegSel));
    $('#trendcap').innerHTML = `<b>${l.current ? 'Aktuelles Spiel, ' : ''}Leg ${l.leg}</b> · Ø ${avg(l.pts, l.darts)} · ${l.darts} Darts · ${l.won ? 'gewonnen mit ' + l.co + ' Checkout' : 'nicht gewonnen'}`;
    return;
  }
  if (e.target.id === 'stReset' && confirm('Gesamtstatistik aller früheren Spiele wirklich löschen?')) {
    history = []; LS.del(KEY.history); renderStats();
  }
});

/* ====================================================================
   Navigation / Bildschirm wach halten
   ==================================================================== */
let wakeLock = null;
async function keepAwake(on){
  try {
    if (on && 'wakeLock' in navigator && !wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => wakeLock = null); }
    if (!on && wakeLock) { await wakeLock.release(); wakeLock = null; }
  } catch(e){}
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && !$('#game').classList.contains('hidden')) keepAwake(true); });

let currentScreen = 'setup', statsReturn = 'setup';
function showScreen(name){
  currentScreen = name;
  $('#setup').classList.toggle('hidden', name !== 'setup');
  $('#game').classList.toggle('hidden', name !== 'game');
  $('#stats').classList.toggle('hidden', name !== 'stats');
  $('#menu').classList.add('hidden');
  hideFlash();
  if (name === 'game') { renderGame(); applyZoom(); keepAwake(true); }
  else if (name === 'stats') { $('#win').classList.add('hidden'); renderStats(); }
  else { $('#win').classList.add('hidden'); renderSetup(); keepAwake(false); }
}

/* ====================================================================
   Events
   ==================================================================== */
$('#startSeg').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; settings.start = +b.dataset.v; saveSettings(); renderSetup(); });
$('#optDI').addEventListener('change', e => { settings.doubleIn = e.target.checked; saveSettings(); });
$('#optDO').addEventListener('change', e => { settings.doubleOut = e.target.checked; saveSettings(); });
$('#optVib').addEventListener('change', e => { settings.vibrate = e.target.checked; saveSettings(); vib(20); });
document.querySelectorAll('[data-step]').forEach(b => b.addEventListener('click', () => {
  const k = b.dataset.step, opts = k === 'legs' ? LEG_OPTS : SET_OPTS;
  const i = Math.max(0, Math.min(opts.length - 1, opts.indexOf(settings[k]) + +b.dataset.d));
  settings[k] = opts[i]; saveSettings(); renderSetup();
}));
$('#plist').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.del != null) { setupPlayers.splice(+b.dataset.del, 1); }
  else if (b.dataset.mv != null) {
    const i = +b.dataset.mv, j = i + +b.dataset.d;
    if (j < 0 || j >= setupPlayers.length) return;
    [setupPlayers[i], setupPlayers[j]] = [setupPlayers[j], setupPlayers[i]];
  }
  savePlayers(); renderSetup();
});
$('#addForm').addEventListener('submit', e => { e.preventDefault(); const inp = $('#pname'); addPlayer(inp.value); inp.value = ''; });
$('#recent').addEventListener('click', e => { const b = e.target.closest('[data-add]'); if (b) addPlayer(b.dataset.add); });
$('#startBtn').addEventListener('click', () => startGame());
$('#resumeBtn').addEventListener('click', () => showScreen('game'));

$('#missBtn').addEventListener('click', () => {
  if (game && game.pending) confirmVisit();
  else if (canThrow()) throwDart(0, 0);
});
$('#confirm').addEventListener('click', e => { if (e.target.closest('[data-act="confirm"]')) confirmVisit(); });
$('#zoomIn').addEventListener('click', () => zoomCenter(1.4));
$('#zoomOut').addEventListener('click', () => zoomCenter(1 / 1.4));
$('#zoomReset').addEventListener('click', resetZoom);
$('#optNum').addEventListener('change', e => { settings.numpad = e.target.checked; saveSettings(); });
$('#inputBtn').addEventListener('click', () => { settings.numpad = !settings.numpad; saveSettings(); renderInputMode(); applyZoom(); vib(15); });

/* ---------- Zifferneingabe ---------- */
let kMod = 1;
function buildKeypad(){
  $('#knums').innerHTML = Array.from({ length:20 }, (_, i) => `<button data-k="${i + 1}">${i + 1}</button>`).join('');
}
function setMod(m){
  kMod = m;
  document.querySelectorAll('#kmods button').forEach(b => b.classList.toggle('on', +b.dataset.mod === m));
  $('#keypad').classList.toggle('m2', m === 2);
  $('#keypad').classList.toggle('m3', m === 3);
}
function renderInputMode(){
  $('#boardwrap').classList.toggle('hidden', settings.numpad);
  $('#keypad').classList.toggle('hidden', !settings.numpad);
  $('#zoomctl').classList.toggle('hidden', settings.numpad);
  $('#inputBtn').textContent = settings.numpad ? '🎯' : '🔢';
}
$('#keypad').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.mod) { const m = +b.dataset.mod; setMod(kMod === m ? 1 : m); vib(8); return; }
  if (!canThrow()) return;
  const k = +b.dataset.k;
  if (k === 50) throwDart(25, 2);
  else if (k === 25) { if (kMod === 3) { vib(80); return; } throwDart(25, kMod === 2 ? 2 : 1); }
  else throwDart(k, kMod);
  setMod(1);
});
$('#undoBtn').addEventListener('click', undo);
$('#flash').addEventListener('pointerdown', e => { e.preventDefault(); hideFlash(); });
$('#menuBtn').addEventListener('click', () => {
  $('#menuSub').textContent = game ? game.players.map(p => `${p.name}: ${p.score}`).join(' · ') : '';
  $('#menu').classList.remove('hidden');
});
function handleAction(act){
  switch (act) {
    case 'close': $('#menu').classList.add('hidden'); break;
    case 'undo': undo(); break;
    case 'confirm': confirmVisit(); break;
    case 'nextLeg': startNextLeg(); break;
    case 'rematch': startGame(game.players.map(p => p.name)); break;
    case 'setup':
      if (game && game.phase === 'matchWon') discardGame();
      showScreen('setup'); break;
    case 'stats': openStats(); break;
    case 'restartLeg':
      if (confirm('Aktuelles Leg wirklich neu starten?')) { restartLeg(); $('#menu').classList.add('hidden'); } break;
    case 'quit':
      if (confirm('Spiel wirklich beenden? Der Spielstand wird gelöscht.')) { discardGame(); showScreen('setup'); } break;
  }
}
['#menu', '#win'].forEach(sel => $(sel).addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (b) handleAction(b.dataset.act);
  else if (sel === '#menu' && e.target.id === 'menu') $('#menu').classList.add('hidden');
}));
// iOS: Pinch-Zoom verhindern
document.addEventListener('gesturestart', e => e.preventDefault(), { passive:false });
document.addEventListener('touchmove', e => { if (e.touches.length > 1) e.preventDefault(); }, { passive:false });

/* ====================================================================
   Start
   ==================================================================== */
buildBoard();
buildKeypad();
applyZoom();
window.addEventListener('resize', applyZoom);
showScreen(game ? 'game' : 'setup');

// Optional: Service Worker (nur bei Auslieferung über http/https, nicht bei file://)
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</body>
</html>
